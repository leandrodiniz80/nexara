version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elevel-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - elevel-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elevel-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - database
      - redis
    networks:
      - elevel-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elevel-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    networks:
      - elevel-network

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elevel-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    networks:
      - elevel-network

  database:
    image: postgres:16-alpine
    container_name: elevel-database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elevel_prospect_ai}
      POSTGRES_USER: ${POSTGRES_USER:-elevel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - elevel-network

  redis:
    image: redis:7-alpine
    container_name: elevel-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - elevel-network

  nginx:
    image: nginx:1.27-alpine
    container_name: elevel-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - elevel-network

networks:
  elevel-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
